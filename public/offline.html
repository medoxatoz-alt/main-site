<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0" />
<title>You're Offline | MedoxAtoZ</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 24px;
    text-align: center;
  }
  .icon {
    width: 84px;
    height: 84px;
    border-radius: 999px;
    background: #ffffff;
    border: 1px solid #e7e5e0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .icon svg { width: 38px; height: 38px; }
  h1 {
    margin: 0 0 10px;
    font-size: 21px;
    font-weight: 800;
    color: #1e2226;
  }
  p {
    margin: 0 0 26px;
    font-size: 14px;
    line-height: 1.6;
    color: #62666b;
    max-width: 320px;
  }
  button {
    appearance: none;
    border: none;
    cursor: pointer;
    background: #d4af37;
    color: #1e2226;
    font-size: 15px;
    font-weight: 700;
    padding: 13px 34px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
  }
  button:active { transform: scale(0.98); }
  .hint { margin-top: 22px; font-size: 12px; color: #9aa0a6; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>No Internet Connection</h1>
    <p>Please check your Wi-Fi or mobile data and try again.</p>
    <button id="retryBtn" type="button">Try Again</button>
    <div class="hint" id="hint">We'll reconnect automatically once you're back online.</div>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('retryBtn');
      btn.addEventListener('click', function () {
        window.location.reload();
      });

      // Auto-recover the moment the browser reports connectivity again.
      window.addEventListener('online', function () {
        window.location.reload();
      });

      // navigator.onLine can be unreliable (e.g. connected to Wi-Fi with no
      // real internet access), so also poll a tiny same-origin request as a
      // belt-and-braces check every few seconds.
      setInterval(function () {
        fetch('/manifest.json', { method: 'HEAD', cache: 'no-store' })
          .then(function () { window.location.reload(); })
          .catch(function () {});
      }, 5000);
    })();
  </script>
</body>
</html>
